# Nginx 配置：挂载到容器 /etc/nginx/conf.d/default.conf
#
# Nginx 在这里干什么（面试高频）：
# 1. 反向代理：只暴露 80 端口，应用端口（8000）不出容器网络，减少攻击面；
# 2. TLS 终止：HTTPS 证书只在 Nginx 配一次，后端只管明文 HTTP；
# 3. 静态资源缓存 / 压缩 / 超时控制：这些通用能力不该写进业务代码。
#
# ⚠️ 这里曾经有个致命的遗漏：只写了 /api/ 和 /docs 的代理，**没有 `location /`**。
# 后果是接口能调、文档能开，但**Web 界面打不开**（nginx 去找自己容器里的
# /usr/share/nginx/html/index.html，404）。这种"一半能用"的问题最难排查 ——
# 因为你会先怀疑前端构建，而不是怀疑 nginx 少了一条 location。

upstream ai_drama_api {
    server api:8000;
    keepalive 32;   # 与后端的连接复用，省掉频繁建连的开销
}

server {
    listen 80;
    server_name _;   # 换成你的域名，例如 drama.example.com

    # 请求体上限（比如将来支持上传参考图）。默认 1m 很容易踩坑。
    client_max_body_size 20m;

    # 传参别丢：后端要拿到真实客户端 IP 和原始协议
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 超时：我们的接口都是"立刻返回 202 + 前端轮询进度"，
    # 所以不需要为长任务调大超时；反而要防止慢连接占用资源。
    proxy_connect_timeout 10s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;

    # 压缩：JSON 响应压缩后能省 70%+ 带宽
    # 注意别把视频加进来（mp4 已经是压缩格式，再压是白烧 CPU）
    gzip on;
    gzip_types application/json application/javascript text/css text/plain;
    gzip_min_length 1024;

    # ── 1. 后端接口 ──
    location /api/ {
        proxy_pass http://ai_drama_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # ── 2. 媒体文件：画面 / 动态片段 / 配音 / 成片 ──
    #
    # 为什么要单独写一条：
    # 这些响应的体积和普通 JSON 完全不是一个量级 —— 一个动态片段 5~11MB、成片几 MB。
    # 默认开启的 proxy_buffering 会先把整个文件缓冲到 nginx 的临时文件再发给客户端，
    # 用户要"等整个视频下载完"才开始播放。
    # 关掉缓冲后是边收边发，首帧快很多；配合后端返回的 Content-Length，
    # 浏览器还能显示正确的进度。
    location ~ ^/api/v1/(shots/\d+/(image|clip|audio)|episodes/\d+/video)$ {
        proxy_pass http://ai_drama_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;   # 大文件传输给足时间
    }

    # ── 3. 接口文档（Swagger / ReDoc / OpenAPI JSON）──
    location ~ ^/(docs|redoc|openapi\.json) {
        proxy_pass http://ai_drama_api;
    }

    # ── 4. 前端构建产物（后端托管）──
    #
    # Vite 打包出来的文件名带内容哈希（index-a1b2c3.js），
    # 内容变了文件名就变，所以可以放心让浏览器**长期缓存**，省掉重复下载。
    location /assets/ {
        proxy_pass http://ai_drama_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Swagger UI 的本地静态资源（后端为"离线文档"自托管的那一份）
    location /static/ {
        proxy_pass http://ai_drama_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        expires 7d;
    }

    # ── 5. 兜底：前端单页应用 ──
    #
    # **这条必须有**，否则 Web 界面打不开（见文件开头的说明）。
    # 前端是 SPA：刷新 /xxx 这种前端路由时服务器上并没有对应文件，
    # 而我们的后端已经用 try_files 的方式兜底返回 index.html，
    # 所以这里统一转给后端即可（不需要在 Nginx 侧再写 try_files）。
    location / {
        proxy_pass http://ai_drama_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}
