# Nginx 配置：放在容器 /etc/nginx/conf.d/default.conf
# Nginx 在这里干什么（面试高频）：
# 1. 反向代理：把公网 80 端口的请求转给内部的 api:8000，应用端口不用暴露到公网；
# 2. TLS 终止：HTTPS 证书配在 Nginx，后端只跑明文 HTTP，逻辑更简单；
# 3. 静态资源/限流/压缩/超时控制：这些通用能力不该写进业务代码。

upstream ai_drama_api {
    server api:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;   # 换成你的域名，例如 drama.example.com

    # 客户端上传大文件（比如参考图）时的上限，默认 1m 很容易踩坑
    client_max_body_size 20m;

    # 传参别丢：后端要拿到真实客户端 IP 和原始协议
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 生成剧本是慢请求（大模型可能跑几十秒），超时给足
    proxy_connect_timeout 10s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;

    # 压缩：JSON 响应压缩后能省 70%+ 带宽
    gzip on;
    gzip_types application/json application/javascript text/css text/plain;
    gzip_min_length 1024;

    location /api/ {
        proxy_pass http://ai_drama_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # 接口文档
    location ~ ^/(docs|redoc|openapi.json) {
        proxy_pass http://ai_drama_api;
    }

    # 将来前端构建产物可以放这里，由 Nginx 直接返回，不经过 Python
    # location / {
    #     root /usr/share/nginx/html;
    #     index index.html;
    #     try_files $uri $uri/ /index.html;   # SPA 路由回退
    # }
}
