# Alembic configuration.
# RULE (learned the hard way twice): keep this file pure ASCII.
# Python's configparser reads .ini files with the OS locale encoding (GBK on a
# Chinese Windows), so UTF-8 Chinese comments crash it with UnicodeDecodeError.
# The same rule applies to requirements.txt.

# Database URL is intentionally NOT written here: env.py injects it from the
# application settings (Settings / environment variables), so migrations always
# target whatever database the current environment is configured to use.

[alembic]
# Directory holding migration scripts (relative to this file's location)
script_location = alembic
# Add the current directory to sys.path so env.py can `import app`
prepend_sys_path = .
# Empty on purpose: env.py sets it via config.set_main_option("sqlalchemy.url", ...)
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
